# =============================================================================
# 选股神AI · 交易安全与风控中枢配置 (Trading Guard)
# -----------------------------------------------------------------------------
# 设计原则：默认安全。系统重启后默认回到 PAPER（纸交易），
# 进入实盘(LIVE/LIVE_PENDING) 必须人工两步确认（arm_live → confirm_arm）。
# 修改本文件后无需重打包源码即可生效（运行时读取）。
# =============================================================================

# ---- 武装模式 ----
default_mode: paper                 # 默认纸交易，绝不默认实盘
require_live_confirmation: true     # 进入实盘必须两步确认令牌

# ---- 组合级风控（熔断）----
max_portfolio_drawdown_pct: 8.0     # 峰谷最大回撤熔断线(%) —— 触及即全局停手
max_daily_loss_pct: 3.0             # 单日最大亏损比例(%)
# 绝对金额线：2026-10-20 起改为「按权益比例推导」。
# 原先写死 ¥5,000，账户做到 ~¥500 万后只占 0.10%，几乎每天都熔断，
# 闭环事实上跑不起来。现在：金额线 = 当日起始权益 × max_daily_loss_abs_pct，
# max_daily_loss_abs 只当兜底下限（设 0 = 完全交给比例推导，账户缩放自动跟随）。
max_daily_loss_abs: 0.0             # 固定金额线(元)；0=不设，交给下面的比例推导
# ⚠️ 两条线是「或」的关系，紧的那条才是真实阈值。
# 2026-10-26 修复：这里原是 1.0，而 max_daily_loss_pct 是 3.0 ——
# 结果每天在 -1% 就熔断，3% 那条线一次都没机会生效，闭环下午全部静默
# （当日就实测触发在 -2.39%，之后一整天不再交易）。
# 现在与比例线对齐：金额线与比例线在同一位置生效，不再互相遮蔽。
max_daily_loss_abs_pct: 3.0         # 金额线 = 权益 × 3.0%（与比例线对齐）

# ---- 持仓约束 ----
max_positions: 20                   # 最大持仓只数
max_single_position_pct: 0.30       # 单票最大仓位(占总资产比例)
max_sector_pct: 0.30                # 单一行业最大集中度(占总资产比例)
# 2026-10-26 由 0.50 收紧到 0.30：20 只持仓下 50% 意味着「两三个行业就能吃掉
# 全部仓位」，等于没有集中度约束；30% 约等于「单行业最多 3~4 只」。

# ---- 下单频率 ----
min_order_interval_sec: 2.0          # 两笔委托最小间隔(秒)
max_orders_per_minute: 10           # 每分钟最大委托数

# ---- 止盈止损（透传给 TradeExecutor）----
# 固定百分比止损在 A 股是结构性错误：年化波动 70% 的题材股日内振幅本身就有
# ±5%，固定 -5% 等于开盘就被噪声扫出去（复盘里「止损后原方向走回去」的元凶）。
# 开启 ATR 后：止损宽度 = max(|stop_loss_pct|, k × ATR%)，再夹在 [min,max] 之间。
# 不变量：宽度只会 >= 配置值，**绝不会比手动设定更紧**，所以升级不会让止损更频繁。
stop_loss_pct: -5.0                 # 硬止损（ATR 关闭时的唯一阈值，开启后是下限）
stop_profit_pct: 15.0               # 止盈
trailing_stop_pct: -3.0             # 移动止损（回撤多少触发，仅在浮盈>0 时生效）
atr_stop_enabled: true              # 2026-10-26 启用自适应止损宽度
atr_stop_k: 2.0                     # 容忍 2 倍日均真实波幅
atr_trailing_k: 1.5                 # 移动止损用更紧的 1.5 倍
atr_stop_min_pct: 2.0               # 再低波动也不允许止损紧于 2%（否则成本就能触发）
atr_stop_max_pct: 15.0              # 再高波动也不允许宽于 15%（否则等于没止损）

# ---- 执行约束（流动性 / 单笔风险预算 / 当日换手）----
# 仓位比例只回答「最多放多少」，不回答「这笔能不能吃掉」。
execution_limits_enabled: true
max_participation_rate: 0.01        # 单笔金额 ≤ 20日平均成交额 × 1%
max_risk_per_trade_pct: 0.005       # 单笔潜在亏损 ≤ 总资产 × 0.5%
# 换算用的「止损距离」下限。实际预算取值 = max(本值, 该标的当日生效止损线)，
# 开启 ATR 自适应止损后止损可放宽到 15%，仍按 5% 算预算 = 单笔风险超标 3 倍。
risk_budget_stop_pct: 0.05          # 止损距离下限（有 ATR 时自动按更宽的实际线算）
max_daily_turnover_pct: 0.30        # 当日买入总额 ≤ 总资产 × 30%

# ---- 组合尾部风险（相关性 VaR）----
# 名义分散 ≠ 风险分散：20 只同涨同跌的票，风险约等于 1 只加杠杆。
var_monitor_enabled: true
max_portfolio_var_pct: 0.025         # 组合 1 日 95% VaR 上限（占总资产 2.5%）
var_confidence_z: 1.65               # 95% 单尾
var_scale_floor: 0.40                # 超预算时最低缩到 40%（连续降仓，不清仓）

# ---- 仓位规模 ----
# 可选: fixed_fractional | volatility_target | kelly
sizing_method: volatility_target     # 2026-10-26 启用：高波动买得少（vol 未知时自动降级为固定比例）
base_risk_fraction: 0.02            # 每笔风险敞口占净值比例(固定比例法/波动率法的降级兜底)
volatility_target_pct: 0.15          # 年化波动率目标(波动率目标法)
kelly_cap: 0.10                      # Kelly 仓位上限(半 Kelly 后再封顶)

# ---- 人工确认 ----
confirm_timeout_sec: 300.0          # 待确认委托超时(秒)，超时自动撤销

# ---- 持久化路径（留空则用 data/ 下默认文件名）----
state_file: ""                       # 武装状态(默认 data/trading_guard_state.json)
journal_file: ""                     # 成交日志(默认 data/trading_journal.jsonl)
