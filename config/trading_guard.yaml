# =============================================================================
# 选股神AI · 交易安全与风控中枢配置 (Trading Guard)
# -----------------------------------------------------------------------------
# 设计原则：默认安全。系统重启后默认回到 PAPER（纸交易），
# 进入实盘(LIVE/LIVE_PENDING) 必须人工两步确认（arm_live → confirm_arm）。
# 修改本文件后无需重打包源码即可生效（运行时读取）。
# =============================================================================

# ---- 武装模式 ----
default_mode: paper                 # 默认纸交易，绝不默认实盘
require_live_confirmation: true     # 进入实盘必须两步确认令牌

# ---- 组合级风控（熔断）----
max_portfolio_drawdown_pct: 8.0     # 峰谷最大回撤熔断线(%) —— 触及即全局停手
max_daily_loss_pct: 3.0             # 单日最大亏损比例(%)
# 绝对金额线：2026-10-20 起改为「按权益比例推导」。
# 原先写死 ¥5,000，账户做到 ~¥500 万后只占 0.10%，几乎每天都熔断，
# 闭环事实上跑不起来。现在：金额线 = 当日起始权益 × max_daily_loss_abs_pct，
# max_daily_loss_abs 只当兜底下限（设 0 = 完全交给比例推导，账户缩放自动跟随）。
max_daily_loss_abs: 0.0             # 固定金额线(元)；0=不设，交给下面的比例推导
# ⚠️ 两条线是「或」的关系，紧的那条才是真实阈值。
# 2026-10-26 修复：这里原是 1.0，而 max_daily_loss_pct 是 3.0 ——
# 结果每天在 -1% 就熔断，3% 那条线一次都没机会生效，闭环下午全部静默
# （当日就实测触发在 -2.39%，之后一整天不再交易）。
# 现在与比例线对齐：金额线与比例线在同一位置生效，不再互相遮蔽。
max_daily_loss_abs_pct: 3.0         # 金额线 = 权益 × 3.0%（与比例线对齐）

# ---- 熔断自愈（仅对 auto(...) 触发的熔断、且 PAPER 模式生效）----
# 无滞后带时解冻只需「回撤刚好不超 8%」，账户必然在 8% 线上反复横跳：
# 10-26 收 7.54% 解冻 → 10-27 建仓 138 万 → 收 8.70% 再熔断 → 10-28 收 8.06%
# （差 ¥2,754 未达线）。用户体感就是「怎么老是这样」。
# 现在解冻要求回撤回落到 (8% − margin) 之下；margin=0 退回旧行为。
auto_resume_drawdown_margin_pct: 2.0   # 滞后带：回撤需 < 6% 才解冻
auto_resume_throttle_days: 2.0         # 解冻后按「交易日」计的半仓冷静期（0=用 throttle_sec）
auto_resume_throttle_sec: 1800         # 冷静期秒级兜底（throttle_days<=0 或日历不可用时）
auto_resume_risk_fraction: 0.5         # 冷静期内下单强度折扣（半仓）

# ---- 持仓约束 ----
max_positions: 20                   # 最大持仓只数
max_single_position_pct: 0.30       # 单票最大仓位(占总资产比例)
max_sector_pct: 0.30                # 单一行业最大集中度(占总资产比例)
# 2026-10-26 由 0.50 收紧到 0.30：20 只持仓下 50% 意味着「两三个行业就能吃掉
# 全部仓位」，等于没有集中度约束；30% 约等于「单行业最多 3~4 只」。

# ---- 下单频率 ----
min_order_interval_sec: 2.0          # 两笔委托最小间隔(秒)
max_orders_per_minute: 10           # 每分钟最大委托数

# ---- 止盈止损（透传给 TradeExecutor）----
# ★ 2026-10-31 重大调整：**关掉个股止盈与移动止损，关掉个股硬止损**。
#
# 依据 = src/core/exec_backtest.py（OHLC 级、次日开盘成交、含成本）在真·样本外
# 面板（1140 天 × 200 只）上的 A/B 实测：
#
#   方案（TopN 8，周期 5 日）      年化      夏普    最大回撤   持有日
#   只按 band 调仓（无任何退出）   +29.9%    1.30    -20.5%     9.0
#   只留 ATR 硬止损                +23.4%    1.09    -16.8%     7.8
#   只留止盈15%+移动止损-3%        -26.3%   -5.09    -75.3%     1.8   ← 灾难
#   实盘当时的完整规则             -27.6%   -5.33    -77.2%     1.8   ← 灾难
#
# 机制：移动止损 -3% 低于 A 股日内正常振幅，几乎每天触发；止盈 15% 太远从不触发。
# 结果是「赢家持有 1.8 天被抽水、输家拿到 -15% 才走」，盈亏比 1.0、盈利因子 0.13。
# 把周期拉到 15 天后，连 ATR 硬止损也变成负贡献（+26.8% → +10.6%，回撤反而更深）。
#
# 结论：**个股层退出规则在这个策略上没有正期望**。风险控制上移到组合层
# （8% 回撤熔断 + 交易日内阁 + 15 日周期换仓）。留 0 = 关闭，不要设成正数。
stop_loss_pct: 0.0                  # 0 = 关闭个股硬止损（风险由组合层熔断承担）
stop_profit_pct: 0.0                # 0 = 关闭固定止盈（>0 才生效）
trailing_stop_pct: 0.0              # 0 = 关闭移动止损（<0 才生效）
atr_stop_enabled: false             # 关闭 ATR 自适应止损（实测在 15 日周期下为负贡献）
atr_stop_k: 2.0                     # 保留参数，atr_stop_enabled=true 时才生效
atr_trailing_k: 1.5
atr_stop_min_pct: 2.0
atr_stop_max_pct: 15.0

# ---- 执行约束（流动性 / 单笔风险预算 / 当日换手）----
# 仓位比例只回答「最多放多少」，不回答「这笔能不能吃掉」。
execution_limits_enabled: true
max_participation_rate: 0.01        # 单笔金额 ≤ 20日平均成交额 × 1%
max_risk_per_trade_pct: 0.02        # 单笔潜在亏损 ≤ 总资产 × 2%（见下方说明的实际约束力）
# ⚠️ 2026-10-31：个股止损关闭后，这条预算的「止损距」只剩 5% 的静态下限，
# 按 0.5% 预算反算会得到 10% 单票上限 —— 与回测里最好的单票 ~11% 基本一致，
# 但会把 TopN 8 的权重结构压变形。故取 2%（= 40% 单票上限，实际由 weight_cap
# 0.30 约束），让它退化成「极端情况的护栏」而不是主约束。
# 真正的风险边界：15 日周期换仓 + 8 只分散 + 组合 8% 回撤熔断。
# 一句话：**individual 层不再做止损，风险预算不许再当主约束**。
risk_budget_use_stop_ceiling: false
risk_budget_stop_pct: 0.05          # 预算换算用的静态止损距离下限（个股止损已关，这是唯一来源）
# 当日买入总额 ≤ 总资产 × 该比例（仅买侧）。
# ⚠️ 必须 ≥ 1 - cash_reserve_pct(0.10)，否则「从现金建满 8 只」一天做不完：
#    原值 0.30 时每次调仓只能建 1/3 仓位，而周期是 15 个交易日 ⇒ 要两个多月才建满，
#    期间长期低仓。回测是 T+1 一次性建满，没有这道闸门（口径漂移实测证据：
#    data/turnover_state.json 记录 2026-10-27 买入 ¥1,382,444 ≈ 权益的 30.4%）。
#    「抑制来回翻仓」已由 rebalance_days=15 + band_pct=0.15 承担。
max_daily_turnover_pct: 0.95

# ---- 组合尾部风险（相关性 VaR）----
# 名义分散 ≠ 风险分散：20 只同涨同跌的票，风险约等于 1 只加杠杆。
var_monitor_enabled: true
max_portfolio_var_pct: 0.025         # 组合 1 日 95% VaR 上限（占总资产 2.5%）
var_confidence_z: 1.65               # 95% 单尾
var_scale_floor: 0.40                # 超预算时最低缩到 40%（连续降仓，不清仓）

# ---- 仓位规模 ----
# 可选: fixed_fractional | volatility_target | kelly
sizing_method: volatility_target     # 2026-10-26 启用：高波动买得少（vol 未知时自动降级为固定比例）
base_risk_fraction: 0.02            # 每笔风险敞口占净值比例(固定比例法/波动率法的降级兜底)
volatility_target_pct: 0.15          # 年化波动率目标(波动率目标法)
kelly_cap: 0.10                      # Kelly 仓位上限(半 Kelly 后再封顶)

# ---- 人工确认 ----
confirm_timeout_sec: 300.0          # 待确认委托超时(秒)，超时自动撤销

# ---- 持久化路径（留空则用 data/ 下默认文件名）----
state_file: ""                       # 武装状态(默认 data/trading_guard_state.json)
journal_file: ""                     # 成交日志(默认 data/trading_journal.jsonl)
